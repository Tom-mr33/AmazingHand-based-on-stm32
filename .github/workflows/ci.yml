name: smoke

on:
  push:
  pull_request:

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Host smoke (no hardware)
        run: python tools/run_smoke.py

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi
      - name: Configure
        working-directory: firmware/stm32
        run: cmake --preset Debug
      - name: Build
        working-directory: firmware/stm32
        run: cmake --build --preset Debug
